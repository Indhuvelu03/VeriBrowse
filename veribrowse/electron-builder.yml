appId: com.veribrowse.app
productName: VeriBrowse
copyright: Copyright © 2026 VeriBrowse Team
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
      - resources
  - from: main/preload.js
    to: app/preload.js
publish: null
win:
  target: nsis
  icon: resources/icon.ico
mac:
  target: dmg
  icon: resources/icon.icns
linux:
  target: AppImage
